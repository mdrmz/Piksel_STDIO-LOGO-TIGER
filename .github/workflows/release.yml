name: Derle ve yayınla

# Sürüm yayınlama: core/__init__.py içindeki __version__ artırılıp main'e gönderildiğinde
# testleri çalıştırır, Windows / macOS / Linux paketlerini derler, "v<sürüm>" etiketini ve Release'i oluşturur.
# O sürümün Release'i zaten varsa sadece test + derleme yapılır (paketler Actions artifact'i olarak kalır).
# Elle de çalıştırılabilir (Actions > Derle ve yayınla > Run workflow) ya da "v*" etiketi gönderilerek tetiklenebilir.
on:
  push:
    branches: [main]
    paths: ["core/__init__.py", ".github/workflows/release.yml", "LogoTigerAnaliz.spec", "requirements.txt"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  surum:
    runs-on: ubuntu-latest
    outputs:
      etiket: ${{ steps.s.outputs.etiket }}
      yayinla: ${{ steps.s.outputs.yayinla }}
    steps:
      - uses: actions/checkout@v5
      - id: s
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SURUM=$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('core/__init__.py').read())[1])")
          ETIKET="v$SURUM"
          echo "etiket=$ETIKET" >> "$GITHUB_OUTPUT"
          if gh release view "$ETIKET" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$ETIKET zaten yayınlanmış; sadece derlenecek."
            echo "yayinla=false" >> "$GITHUB_OUTPUT"
          else
            echo "$ETIKET yayınlanacak."
            echo "yayinla=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: surum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: python demo/demo_db_olustur.py demo/logo_demo.sqlite
      - run: pytest -q tests

  entegrasyon:
    needs: surum
    uses: ./.github/workflows/entegrasyon.yml

  derle:
    needs: [test, entegrasyon]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            paket: LogoTigerAnaliz-windows-x64.zip
          - os: macos-latest
            paket: LogoTigerAnaliz-macos-apple-silicon.zip
          - os: ubuntu-latest
            paket: LogoTigerAnaliz-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Paketler
        run: pip install -r requirements.txt pyinstaller
      - name: Demo veri
        run: python demo/demo_db_olustur.py demo/logo_demo.sqlite
      - name: PyInstaller
        run: pyinstaller LogoTigerAnaliz.spec --noconfirm
      - name: Duman testi (uygulama açılıyor mu)
        shell: bash
        env:
          LOGO_ANALIZ_TARAYICI_ACMA: "1"
          LOGO_ANALIZ_KLASOR: ${{ runner.temp }}/la
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=dist/LogoTigerAnaliz/LogoTigerAnaliz.exe; else EXE=dist/LogoTigerAnaliz/LogoTigerAnaliz; fi
          "$EXE" > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5055/ > /dev/null; then echo "Uygulama ayakta"; break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:5055/ | grep -q "Logo Tiger Analiz" || { cat app.log; exit 1; }
      - name: Paketle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item README.md dist/LogoTigerAnaliz/
          Compress-Archive -Path dist/LogoTigerAnaliz -DestinationPath ${{ matrix.paket }}
      - name: Paketle (macOS)
        if: runner.os == 'macOS'
        run: |
          cp README.md docker-compose.yml dist/LogoTigerAnaliz/
          cd dist && ditto -c -k --keepParent LogoTigerAnaliz ../${{ matrix.paket }}
      - name: Paketle (Linux)
        if: runner.os == 'Linux'
        run: |
          cp README.md docker-compose.yml dist/LogoTigerAnaliz/
          tar -C dist -czf ${{ matrix.paket }} LogoTigerAnaliz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.paket }}
          path: ${{ matrix.paket }}

  yayinla:
    needs: [surum, derle]
    if: needs.surum.outputs.yayinla == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: paketler, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.surum.outputs.etiket }}
          name: Logo Tiger Analiz ${{ needs.surum.outputs.etiket }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: paketler/*
          generate_release_notes: true
          body: |
            ## İndirme
            | Sistem | Dosya |
            |---|---|
            | Windows 10/11 (64 bit) | `LogoTigerAnaliz-windows-x64.zip` |
            | macOS (M1/M2/M3/M4) | `LogoTigerAnaliz-macos-apple-silicon.zip` |
            | Linux (64 bit) | `LogoTigerAnaliz-linux-x64.tar.gz` |

            Zip'i açın, `LogoTigerAnaliz` klasöründeki programı çalıştırın; tarayıcı kendiliğinden açılır.
            Yedeği seçip **Başlat**'a basın. Bilgisayarda SQL Server yoksa program ilk seferde kendisi kurar
            (Windows: SQL Server 2022 Express, internet + yönetici izni; macOS/Linux: Docker gerekir).
