name: Entegrasyon testi

# Gerçek makinede: programın kendi kodu SQL Server'ı hazırlar (Windows: Express kurulumu, Linux: Docker konteyneri),
# Logo yapısında veritabanından .bak alınır, uygulama bu yedeği geri yükleyip analiz eder ve sonuçlar karşılaştırılır.
on:
  push:
    branches: [main]
    paths: ["core/**", "app.py", "tests/**", "requirements.txt", ".github/workflows/entegrasyon.yml"]
  workflow_dispatch:
  workflow_call:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  sql:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    name: sql (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      LOGO_ANALIZ_KLASOR: ${{ github.workspace }}/../LogoAnalizTest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python demo/demo_db_olustur.py demo/logo_demo.sqlite
      - name: Entegrasyon testi (kaynak koddan)
        run: python tests/entegrasyon.py
      - name: Paketlenmiş uygulamayı derle
        run: |
          pip install pyinstaller
          pyinstaller LogoTigerAnaliz.spec --noconfirm
      - name: Paketlenmiş uygulama ile uçtan uca test
        run: python tests/paket_testi.py
      - name: Kurulum günlükleri (hata olursa)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem "C:\Program Files\Microsoft SQL Server\*\Setup Bootstrap\Log" -Recurse -Filter Summary*.txt -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "---- $($_.FullName)"; Get-Content $_.FullName -Tail 60 }
      - name: Konteyner günlükleri (hata olursa)
        if: failure() && runner.os == 'Linux'
        run: docker logs logo-analiz-mssql 2>&1 | tail -80 || true
