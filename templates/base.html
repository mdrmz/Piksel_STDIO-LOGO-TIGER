<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block baslik %}Logo Tiger Analiz{% endblock %}</title>
<style>
  :root { --lacivert:#1F3864; --mavi:#2E5597; --zemin:#F4F5F7; --kart:#fff; --cizgi:#E2E5EA; --yazi:#1C2230; --soluk:#6B7280;
          --a:#C6EFCE; --a-y:#1E6B2F; --b:#FFEB9C; --b-y:#7A5A00; --c:#F4CCCC; --c-y:#8A1C1C; --uyari:#B45309; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color:var(--yazi); background:var(--zemin); }
  header { background:var(--lacivert); color:#fff; padding:14px 28px; display:flex; align-items:center; gap:14px; }
  header a { color:#fff; text-decoration:none; }
  header .logo { font-weight:600; font-size:17px; letter-spacing:.2px; }
  header .alt { opacity:.7; font-size:13px; }
  main { max-width:1180px; margin:0 auto; padding:26px 28px 60px; }
  h1 { font-size:22px; margin:0 0 4px; } h2 { font-size:17px; margin:28px 0 10px; } h3 { font-size:15px; margin:0 0 8px; }
  .soluk { color:var(--soluk); } .kucuk { font-size:13px; }
  .kart { background:var(--kart); border:1px solid var(--cizgi); border-radius:10px; padding:18px 20px; }
  .izgara { display:grid; gap:16px; } .i2 { grid-template-columns:repeat(2,1fr); } .i3 { grid-template-columns:repeat(3,1fr); } .i4 { grid-template-columns:repeat(4,1fr); }
  @media (max-width:900px) { .i2,.i3,.i4 { grid-template-columns:1fr; } }
  label { display:block; font-size:13px; color:var(--soluk); margin:10px 0 4px; }
  input[type=text], input[type=password], input[type=number], select { width:100%; padding:8px 10px; border:1px solid #CBD2DC; border-radius:6px; font:inherit; background:#fff; }
  input[type=file] { font:inherit; }
  .btn { display:inline-block; background:var(--lacivert); color:#fff; border:0; border-radius:6px; padding:9px 16px; font:inherit; font-weight:500; cursor:pointer; text-decoration:none; }
  .btn:hover { background:var(--mavi); } .btn.ikincil { background:#fff; color:var(--lacivert); border:1px solid var(--lacivert); }
  .btn.kucuk { padding:5px 10px; font-size:13px; } .btn.sil { background:#fff; color:#9B1C1C; border:1px solid #E5B4B4; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th { text-align:left; font-weight:600; color:var(--soluk); font-size:12px; border-bottom:1px solid var(--cizgi); padding:7px 8px; }
  td { border-bottom:1px solid #F0F1F4; padding:6px 8px; } td.s { text-align:right; font-variant-numeric:tabular-nums; } th.s { text-align:right; }
  .rozet { display:inline-block; min-width:22px; text-align:center; border-radius:4px; font-weight:600; font-size:12px; padding:1px 6px; }
  .rA { background:var(--a); color:var(--a-y); } .rB { background:var(--b); color:var(--b-y); } .rC { background:var(--c); color:var(--c-y); }
  .kpi .deger { font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; } .kpi .ad { font-size:12.5px; color:var(--soluk); }
  .uyari { background:#FFF7ED; border:1px solid #FED7AA; color:var(--uyari); border-radius:8px; padding:10px 14px; font-size:14px; }
  .sekme { display:flex; gap:6px; margin-bottom:-1px; } .sekme button { border:1px solid var(--cizgi); background:#EEF0F3; padding:8px 14px; border-radius:8px 8px 0 0; cursor:pointer; font:inherit; color:var(--soluk); }
  .sekme button.aktif { background:#fff; color:var(--yazi); border-bottom-color:#fff; font-weight:500; }
  .log { background:#0F172A; color:#D1D5DB; font:12.5px/1.6 ui-monospace, Menlo, Consolas, monospace; border-radius:8px; padding:14px; height:320px; overflow:auto; white-space:pre-wrap; }
  details summary { cursor:pointer; color:var(--mavi); font-size:13.5px; }
  code { background:#EEF1F5; padding:1px 5px; border-radius:4px; font-size:12.5px; }
  .yz-cevap { font-size:14.5px; } .yz-cevap h3,.yz-cevap h4,.yz-cevap h5 { margin:14px 0 6px; font-size:15px; }
  .yz-cevap table { margin:8px 0; } .yz-cevap p { margin:6px 0; } .yz-cevap ul,.yz-cevap ol { margin:6px 0; padding-left:22px; }
  .soru { background:#EEF3FB; border-radius:8px; padding:8px 12px; margin:14px 0 6px; font-weight:500; }
  textarea { width:100%; padding:9px 11px; border:1px solid #CBD2DC; border-radius:6px; font:inherit; resize:vertical; }
  .bekliyor { color:var(--soluk); font-style:italic; }
</style>
</head>
<body>
<header><a class="logo" href="/">Logo Tiger Analiz</a><span class="alt">Piksel Analitik · v{{ surum }}</span>
  <nav style="margin-left:auto;display:flex;gap:18px;font-size:14px"><a href="/">Analizler</a><a href="/ayarlar">Yapay zekâ ayarları</a></nav></header>
<main>{% block icerik %}{% endblock %}</main>
<footer style="max-width:1180px;margin:0 auto;padding:0 28px 30px;font-size:12.5px;color:var(--soluk)">
  Logo Tiger Analiz v{{ surum }} · <a href="/tanilama" style="color:inherit">Tanılama paketi</a> ·
  <a href="https://github.com/mdrmz/Piksel_STDIO-LOGO-TIGER/issues" target="_blank" style="color:inherit">Sorun bildir</a></footer>
</body>
</html>
